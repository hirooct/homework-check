<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--blue:#2563eb;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--green:#059669;--red:#dc2626}
    *{box-sizing:border-box}.hidden{display:none!important}body{margin:0;background:linear-gradient(135deg,#f8fbff,#eef4fb);font-family:"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink)}
    header{background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);padding:13px 18px}.head{max-width:900px;margin:auto;display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#3b82f6,#1d4ed8);font-size:22px}.head h1{font-size:18px;margin:0}.head p{font-size:12px;color:var(--muted);margin:2px 0 0}
    main{max-width:900px;margin:auto;padding:22px 16px 40px}.welcome{margin-bottom:18px}.welcome h2{margin:0;font-size:24px}.welcome p{margin:5px 0;color:var(--muted)}
    .summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:15px}.stat,.card{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(30,64,175,.08)}.stat{padding:18px}.stat small{color:var(--muted);font-weight:700}.stat strong{display:block;font-size:30px;margin-top:5px}.stat strong span{font-size:14px;color:var(--muted)}
    .card{padding:17px}.controls{display:flex;gap:10px;align-items:end;margin-bottom:14px}.field{flex:1}.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:5px}select,button{min-height:42px;border-radius:10px;font:inherit}select{width:100%;border:1px solid #cbd5e1;background:white;padding:8px 10px}button{border:0;padding:9px 14px;font-weight:800;cursor:pointer;background:#eff6ff;color:var(--blue)}button.active{background:var(--blue);color:white}.refresh{background:white;border:1px solid #bfdbfe}.updated{font-size:12px;color:var(--muted);text-align:right;margin:0 2px 8px}.notice{margin:0 0 14px;padding:13px 16px;border-radius:14px;font-weight:800}.notice.warn{background:#fff1f2;border:1px solid #fecdd3;color:#be123c}.notice.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#047857}.error{padding:22px;border:1px solid #fecaca;border-radius:14px;background:#fff1f2;color:#9f1239;text-align:center;line-height:1.7}.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:38px;color:var(--muted)}.spin{width:20px;height:20px;border:3px solid #bfdbfe;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .item{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid #edf2f7}.item:last-child{border:0}.date{color:var(--muted);font-size:13px}.task{font-weight:800}.badge{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:900}.done{background:#dcfce7;color:#047857}.missing{background:#ffe4e6;color:#be123c}.empty{text-align:center;color:var(--muted);padding:38px 12px}
    .dutyCard{margin-bottom:15px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#1d4ed8,#2563eb);color:white;box-shadow:0 14px 30px #bfdbfe}.dutyCard h3{margin:0 0 7px}.dutyCard p{margin:4px 0 13px;color:#dbeafe}.dutyCard button{background:white;color:#1d4ed8;width:100%}.cameraOverlay{position:fixed;inset:0;z-index:100;background:#07111f;color:white;display:flex;flex-direction:column}.cameraHead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0f172a}.cameraHead b{font-size:16px}.cameraHead button{background:#334155;color:white}.cameraBody{position:relative;flex:1;min-height:260px;overflow:hidden;background:#000}.cameraBody video{width:100%;height:100%;object-fit:cover}.scanGuide{position:absolute;left:10%;right:10%;top:38%;height:24%;border:4px solid #60a5fa;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}.scanGuide:after{content:'バーコードを枠の中へ';position:absolute;left:0;right:0;bottom:-34px;text-align:center;font-weight:800}.cameraPanel{padding:12px 16px 18px;background:#0f172a}.cameraState{padding:10px;border-radius:10px;background:#1e293b;text-align:center;font-weight:800;margin-bottom:10px}.cameraState.ok{background:#065f46}.cameraState.ng{background:#9f1239}.manualRow{display:flex;gap:8px}.manualRow input{flex:1;min-width:0;border:1px solid #475569;background:#fff;color:#111827;border-radius:10px;padding:10px;font-size:18px;text-align:center;letter-spacing:3px}.manualRow button{background:#2563eb;color:white}
    @media(max-width:600px){main{padding:17px 12px}.welcome h2{font-size:21px}.controls{align-items:stretch;flex-direction:column}.controls button{width:100%}.item{grid-template-columns:72px 1fr}.item .badge{grid-column:2;justify-self:start}.card{padding:13px}}
  </style>
</head>
<body>
<header><div class="head"><div class="logo">✓</div><div><h1>Homework Check</h1><p>自分の提出状況</p></div></div></header>
<main>
  <div class="welcome"><h2 id="welcomeTitle">提出物を確認しよう</h2><p>「未提出」が残っていないか、最新の状態を確認できます。</p></div>
  <div class="summary"><div class="stat"><small>提出済み</small><strong id="doneCount">0<span>件</span></strong></div><div class="stat"><small>未提出</small><strong id="missingCount">0<span>件</span></strong></div></div>
  <div id="dutyArea"></div>
  <div id="missingNotice" class="notice hidden"></div>
  <p id="updated" class="updated"></p>
  <div class="card"><div class="controls"><div class="field"><label>日付で絞り込み</label><select id="dateFilter" onchange="render()"><option value="">すべての日付</option></select></div><button id="missingBtn" onclick="toggleMissing()">未提出だけ表示</button><button class="refresh" onclick="loadStatus()">↻ 最新に更新</button></div><div id="list"><div class="loading"><span class="spin"></span>提出状況を確認しています</div></div></div>
</main>
<div id="dutyOverlay" class="cameraOverlay hidden"><div class="cameraHead"><div><b id="dutyTitle">宿題チェック</b><div id="dutyEnds" class="date"></div></div><button onclick="stopDutyCamera()">終了</button></div><div class="cameraBody"><video id="dutyVideo" autoplay playsinline muted></video><div class="scanGuide"></div></div><div class="cameraPanel"><div id="cameraState" class="cameraState">カメラを準備しています</div><div class="manualRow"><input id="dutyManual" inputmode="numeric" maxlength="4" placeholder="6301" onkeydown="dutyManualKey(event)"><button onclick="submitDutyManual()">登録</button></div></div></div>
<script>
let rows=[],dutySessions=[],onlyMissing=false,loading=false;
function server(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[fn](...args))}
function esc(v){const d=document.createElement('div');d.textContent=v==null?'':v;return d.innerHTML}
async function loadStatus(){if(loading)return;loading=true;document.getElementById('list').innerHTML='<div class="loading"><span class="spin"></span>最新の提出状況を確認しています</div>';try{const data=await server('api_getMyStatus');if(!data.success){showError(data.message);return}rows=data.rows||[];dutySessions=data.dutySessions||[];document.getElementById('welcomeTitle').textContent=data.name?`${data.name}さんの提出物`:'提出物を確認しよう';fillDates();renderDuty();render();document.getElementById('updated').textContent=`最終更新 ${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`}catch(e){showError(`提出状況を取得できませんでした。時間をおいて「最新に更新」を押してください。\n${e.message||e}`)}finally{loading=false}}
function fillDates(){const select=document.getElementById('dateFilter'),current=select.value,dates=[...new Map(rows.map(r=>[r.date,r.dateLabel])).entries()];select.innerHTML='<option value="">すべての日付</option>'+dates.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');if(dates.some(([v])=>v===current))select.value=current}
function toggleMissing(){onlyMissing=!onlyMissing;document.getElementById('missingBtn').classList.toggle('active',onlyMissing);document.getElementById('missingBtn').textContent=onlyMissing?'すべて表示':'未提出だけ表示';render()}
function render(){const date=document.getElementById('dateFilter').value,missing=rows.filter(r=>!r.submitted).length;let visible=rows.filter(r=>!date||r.date===date);if(onlyMissing)visible=visible.filter(r=>!r.submitted);visible.sort((a,b)=>Number(a.submitted)-Number(b.submitted)||b.date.localeCompare(a.date));document.getElementById('doneCount').firstChild.nodeValue=rows.filter(r=>r.submitted).length;document.getElementById('missingCount').firstChild.nodeValue=missing;const notice=document.getElementById('missingNotice');notice.className=`notice ${missing?'warn':'ok'}`;notice.textContent=missing?`未提出の課題が ${missing}件あります。下の一覧で課題名を確認してください。`:'現在、未提出の課題はありません。';document.getElementById('list').innerHTML=visible.length?visible.map(r=>`<div class="item"><div class="date">${esc(r.dateLabel)}</div><div class="task">${esc(r.title)}${r.subject?`<div class="date">${esc(r.subject)}</div>`:''}</div><div class="badge ${r.submitted?'done':'missing'}">${r.submitted?'〇 提出済み':'未提出'}</div></div>`).join(''):'<div class="empty">条件に合う課題はありません</div>'}
function renderDuty(){document.getElementById('dutyArea').innerHTML=dutySessions.map(d=>`<div class="dutyCard"><h3>📷 今日の宿題チェック当番です</h3><p>${esc(d.dateLabel)}　${esc(d.title)}<br>終了 ${new Date(d.endsAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</p><button onclick="startDutyCamera('${d.dutySessionId}')">カメラでチェックを始める</button></div>`).join('')}
let dutyStream=null,dutyDetector=null,dutyDetecting=false,dutyLastDetect=0,activeDutyId='',dutyQueue=[],dutySending=false,dutySendTimer=null,dutyCooldown={};
async function startDutyCamera(id){const duty=dutySessions.find(x=>x.dutySessionId===id);if(!duty)return;activeDutyId=id;document.getElementById('dutyTitle').textContent=duty.title;document.getElementById('dutyEnds').textContent=`終了 ${new Date(duty.endsAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`;document.getElementById('dutyOverlay').classList.remove('hidden');setCameraState('カメラの使用を許可してください','');try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('この端末ではカメラを利用できません。');dutyStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});const video=document.getElementById('dutyVideo');video.srcObject=dutyStream;await video.play();if(!('BarcodeDetector' in window))throw new Error('このブラウザはカメラのバーコード検出に対応していません。下の4桁入力を利用してください。');const supported=await BarcodeDetector.getSupportedFormats();const wanted=['code_128','code_39','codabar','ean_8','qr_code'].filter(x=>supported.includes(x));if(!wanted.length)throw new Error('現在のバーコード形式を検出できません。下の4桁入力を利用してください。');dutyDetector=new BarcodeDetector({formats:wanted});setCameraState('バーコードを青い枠の中に映してください','');requestAnimationFrame(detectDutyBarcode)}catch(e){setCameraState(e.message||String(e),'ng')}}
async function detectDutyBarcode(time){if(!dutyStream||document.getElementById('dutyOverlay').classList.contains('hidden'))return;if(!dutyDetecting&&dutyDetector&&time-dutyLastDetect>180){dutyDetecting=true;dutyLastDetect=time;try{const found=await dutyDetector.detect(document.getElementById('dutyVideo'));for(const code of found){const raw=String(code.rawValue||'').trim();if(/^\d{4}$/.test(raw)&&(!dutyCooldown[raw]||Date.now()-dutyCooldown[raw]>2500)){dutyCooldown[raw]=Date.now();enqueueDutyBarcode(raw);break}}}catch(e){}finally{dutyDetecting=false}}requestAnimationFrame(detectDutyBarcode)}
function dutyManualKey(e){if(e.key==='Enter'){e.preventDefault();submitDutyManual()}}
function submitDutyManual(){const input=document.getElementById('dutyManual'),barcode=input.value.trim();input.value='';if(!/^\d{4}$/.test(barcode)){setCameraState('4桁のバーコードを入力してください','ng');return}enqueueDutyBarcode(barcode)}
function enqueueDutyBarcode(barcode){if(!activeDutyId)return;dutyQueue.push({sessionId:activeDutyId,barcode});setCameraState(`${barcode} を処理待ちに追加しました（残り${dutyQueue.length}件）`,'');clearTimeout(dutySendTimer);dutySendTimer=setTimeout(processDutyQueue,160)}
async function processDutyQueue(){if(dutySending||!dutyQueue.length)return;dutySending=true;const sessionId=dutyQueue[0].sessionId,batch=dutyQueue.filter(x=>x.sessionId===sessionId).slice(0,50);dutyQueue=dutyQueue.filter(x=>!batch.includes(x));setCameraState(`バックグラウンドで ${batch.length}件を保存中…`,'');try{const r=await server('api_scanDutyBatch',{dutySessionId:sessionId,barcodes:batch.map(x=>x.barcode)}),errors=r.results.filter(x=>!x.success);if(errors.length)setCameraState(errors[errors.length-1].message,'ng');else setCameraState(`${r.saved}件を登録しました。提出済み ${r.count}人`,'ok')}catch(e){setCameraState(e.message||String(e),'ng')}finally{dutySending=false;if(dutyQueue.length)setTimeout(processDutyQueue,30)}}
function setCameraState(message,type){const x=document.getElementById('cameraState');x.className=`cameraState ${type||''}`;x.textContent=message}
function stopDutyCamera(){document.getElementById('dutyOverlay').classList.add('hidden');if(dutyStream)dutyStream.getTracks().forEach(t=>t.stop());dutyStream=null;dutyDetector=null;activeDutyId='';loadStatus()}
function showError(message){rows=[];document.getElementById('doneCount').firstChild.nodeValue='0';document.getElementById('missingCount').firstChild.nodeValue='0';document.getElementById('updated').textContent='';document.getElementById('missingNotice').className='notice hidden';document.getElementById('list').innerHTML=`<div class="error"><b>提出状況を表示できません</b><br>${esc(message).replace(/\n/g,'<br>')}</div>`}
loadStatus();
</script>
</body>
</html>
